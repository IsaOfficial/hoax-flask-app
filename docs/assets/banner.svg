<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HoaxLens — Analisis berita bahasa Indonesia</title>
  <desc id="desc">Banner biru gelap dengan simbol perisai dan tagline Lebih kritis membaca. Lebih bijak percaya.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142c4e"/><stop offset="1" stop-color="#080f1d"/></linearGradient>
    <linearGradient id="shield" x2="1" y2="1"><stop stop-color="#64afff"/><stop offset="1" stop-color="#2458bf"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7fbaff" opacity=".13"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#dots)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="68" fill="#8cbcf5" font-size="12" letter-spacing="3">INDONESIAN NEWS ANALYSIS</text>
    <text x="60" y="149" fill="#f0f5ff" font-size="65" font-weight="700">Hoax<tspan fill="#64afff">Lens</tspan></text>
    <text x="64" y="202" fill="#d6e5fa" font-size="24">Lebih kritis membaca. Lebih bijak percaya.</text>
    <text x="64" y="245" fill="#9fb3cf" font-size="17">Analisis teks berita dengan model XGBoost + ROS.</text>
    <text x="64" y="306" fill="#79abeb" font-size="12" letter-spacing="2">FLASK  /  TF-IDF  /  BAHASA INDONESIA</text>
  </g>
  <g transform="translate(985 175)">
    <circle r="128" fill="none" stroke="#3f6fa4" opacity=".4"/>
    <circle r="150" fill="none" stroke="#3f6fa4" opacity=".25" stroke-dasharray="3 9"/>
    <path d="M0 -92 L77 -62 L70 31 Q52 78 0 103 Q-52 78 -70 31 L-77 -62 Z" fill="url(#shield)" opacity=".8"/>
    <path d="M-32 5 L-7 31 L39 -30" fill="none" stroke="#e1f1ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
